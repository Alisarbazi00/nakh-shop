<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فروشگاه پوشاک نخ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: RTL storefront — sticky masthead, season collection tiles, filter row, photo grid; #p{id} opens a product page; slide-in cart drawer */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#191c2b; --muted:#5f6478;
  --line:#dcdfe8; --accent:#26307a; --accent-ink:#ffffff; --madder:#b23a2e;
  --swatch-bg:#e8eaf1;
  --f-display:"Vazirmatn",Tahoma,sans-serif; --f-body:"Vazirmatn",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141d; --surface:#1b1e2a; --fg:#eceef5; --muted:#a2a7bb; --line:#2d3142;
  --accent:#8f9bff; --accent-ink:#10132a; --madder:#ff8a7a; --swatch-bg:#232737; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141d; --surface:#1b1e2a; --fg:#eceef5; --muted:#a2a7bb; --line:#2d3142;
  --accent:#8f9bff; --accent-ink:#10132a; --madder:#ff8a7a; --swatch-bg:#232737; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin-inline:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{font-family:var(--f-display);font-weight:900;font-size:1.6rem;letter-spacing:-.5px;display:flex;align-items:baseline;gap:8px}
.logo small{font-weight:400;font-size:.8rem;color:var(--muted)}
.cart-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.cart-btn .count{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.8rem;font-weight:600}

/* photos */
.ph{position:relative;background:var(--swatch-bg);border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.ph .alt{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--muted);font-size:.85rem}

/* home */
.hero{margin-block:28px 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:end}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(2rem,5vw,3.2rem);line-height:1.25;margin:0;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);margin:0;max-width:46ch}
.collections{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.col{position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;text-align:right;background:var(--swatch-bg)}
.col .ph{aspect-ratio:16/10;border-radius:0}
.col span{position:absolute;inset-inline:0;bottom:0;padding:28px 16px 12px;background:linear-gradient(transparent,rgb(10 12 25 / .75));color:#fff;font-weight:800;font-size:1.15rem}
.col span small{display:block;font-weight:400;font-size:.8rem;opacity:.85}
.col:hover img{transform:scale(1.04)}
.band{margin-block:0 28px;display:flex;flex-wrap:wrap;gap:8px 24px;padding:12px 18px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:.9rem}
.band b{font-weight:800}

.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row .lbl{font-size:.82rem;color:var(--muted);min-width:56px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.found{font-size:.85rem;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px 20px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover img{transform:scale(1.04)}
.tag{position:absolute;top:10px;right:10px;background:var(--madder);color:#fff;font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px;z-index:1}
.season{position:absolute;bottom:10px;right:10px;background:var(--surface);color:var(--fg);font-size:.72rem;padding:1px 10px;border-radius:999px;z-index:1}
.card h3{margin:4px 0 0;font-size:1rem;font-weight:600}
.fabric{font-size:.8rem;color:var(--muted);margin:0}
.price{font-weight:800;white-space:nowrap}
.price s{font-weight:400;color:var(--muted);font-size:.8rem;margin-inline-end:6px}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);padding:0}
.none{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}

/* product page */
.crumbs{margin-block:20px;font-size:.85rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a:hover{color:var(--accent)}
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:start}
#main{position:relative}
.gallery{display:flex;flex-direction:column;gap:10px;min-width:0}
.thumbs{display:flex;gap:8px}
.thumbs button{width:72px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:none}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs .ph{border-radius:6px}
.info{min-width:0;display:flex;flex-direction:column;gap:16px}
.info h1{font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,3.5vw,2.2rem);line-height:1.3;margin:0;text-wrap:balance}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.info .price{font-size:1.4rem}
.material{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.material b{color:var(--accent)}
.opt h4{margin:0 0 6px;font-size:.88rem;font-weight:600}
.opt h4 span{font-weight:400;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--fg)}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.size{font-family:var(--f-mono);font-size:.85rem;min-width:46px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.size[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.size:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.buy{display:flex;gap:10px;align-items:stretch}
.qty{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface)}
.qty button{width:28px;height:28px;border:0;background:var(--bg);border-radius:6px;line-height:1}
.qty span{min-width:24px;text-align:center}
.add{flex:1;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:11px;font-weight:600}
.add:hover{filter:brightness(1.1)}
.add:disabled{opacity:.45;cursor:not-allowed}
.section h3{font-size:1rem;margin:0 0 8px}
.section p{margin:0;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.specs th{width:38%;color:var(--muted);font-weight:400}
.sizetbl th{font-weight:600;color:var(--muted);background:var(--surface)}
.sizetbl td{font-variant-numeric:tabular-nums}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.82rem;color:var(--muted)}
.perks div{border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.related{margin-top:48px}
.related h2{font-size:1.2rem;margin:0 0 14px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgb(10 12 25 / .45);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,100%);background:var(--surface);z-index:50;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-100%);transition:transform .3s ease;box-shadow:0 0 40px rgb(0 0 0 / .25)}
.drawer.open{transform:none}
.drawer h2{margin:0 0 8px;font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;font-size:1.4rem;line-height:1}
.items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:10px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center}
.item .ph{border-radius:6px}
.item .meta{min-width:0;font-size:.86rem}
.item .meta b{display:block;font-weight:600}
.item .meta span{color:var(--muted);font-size:.78rem}
.empty{color:var(--muted);text-align:center;margin-top:40px}
.sum{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-weight:800;font-size:1.05rem}
.ship-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.ship-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.checkout{margin-top:6px;border:0;background:var(--fg);color:var(--bg);border-radius:8px;padding:12px;font-weight:600}
.checkout:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:.82rem;color:var(--muted)}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
footer{margin-top:56px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:800px){.hero,.pd{grid-template-columns:1fr}.collections{grid-template-columns:1fr 1fr 1fr;gap:8px}.col span{font-size:.95rem;padding:20px 10px 8px}.col span small{display:none}}
@media (max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:18px 12px}.card h3{font-size:.9rem}.perks{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function card(p){
  const off=p.old?Math.round((1-p.price/p.old)*100):0;
  return `<a class="card" href="#p${p.id}">
    <div class="ph">${off?`<span class="tag">${fa(off)}٪ تخفیف</span>`:''}<span class="season">${SEASONS[p.season]}</span>${photo(p.img[0],p.name,500,625).replace(/^<div class="ph">|<\/div>$/g,'')}</div>
    <h3>${p.name}</h3>
    <p class="fabric">${p.fabric}</p>
    <span class="price">${p.old?`<s>${fa(p.old)}</s>`:''}${toman(p.price)}</span>
    <div class="dots">${p.colors.map(x=>`<span class="dot" style="background:${x.h}" title="${x.n}"></span>`).join('')}</div>
  </a>`;
}

function renderGrid(){
  let list=PRODUCTS.filter(p=>(view.cat==='all'||p.cat===view.cat)
    &&(view.season==='all'||p.season===(view.season==='all4'?'all':view.season))
    &&(!view.q||(p.name+p.fabric+p.comp).includes(view.q)));
  if(view.sort==='low')list=[...list].sort((a,b)=>a.price-b.price);
  if(view.sort==='high')list=[...list].sort((a,b)=>b.price-a.price);
  if(view.sort==='off')list=list.filter(p=>p.old);
  if(view.sort==='new')list=[...list].reverse().sort((a,b)=>(a.season==='winter'||a.season==='autumn'?0:1)-(b.season==='winter'||b.season==='autumn'?0:1));
  $('#found').textContent=fa(list.length)+' محصول';
  $('#grid').innerHTML=list.length?list.map(card).join(''):'<p class="none">محصولی با این فیلترها پیدا نشد. یکی از فیلترها را بردارید.</p>';
}

function product(p){

  const specs=[['جنس و ترکیب پارچه',p.comp],...p.extra,['فیت (برش)',p.fit],['کشور تولید',p.origin],['نگهداری و شستشو',p.care]];
  const rel=PRODUCTS.filter(x=>x.id!==p.id&&(x.season===p.season||x.cat===p.cat)).slice(0,4);
  $('#app').innerHTML=`
  <nav class="crumbs"><a href="#">خانه</a><span>/</span><a href="#" data-cat="${p.cat}">${CATS[p.cat]}</a><span>/</span><span>${p.name}</span></nav>
  <section class="pd">
    <div class="gallery">
      <div id="main">${off?`<span class="tag">${fa(off)}٪ تخفیف</span>`:''}${photo(p.img[k.img],p.name,900,1125,1)}</div>
      ${p.img.length>1?`<div class="thumbs">${p.img.map((im,i)=>`<button data-img="${i}" aria-pressed="${i===k.img}" aria-label="عکس ${fa(i+1)}">${photo(im,'',150,188,1)}</button>`).join('')}</div>`:''}
    </div>
    <div class="info">
      <div class="pills"><span class="pill">${CATS[p.cat]}</span><span class="pill">${SEASONS[p.season]}</span><span class="pill">کد کالا: NK-${String(p.id).padStart(3,'0')}</span></div>
      <h1>${p.name}</h1>
      <span class="price">${p.old?`<s>${fa(p.old)}</s>`:''}${toman(p.price)}</span>
      <div class="material">جنس: <b>${p.comp}</b></div>
      <div class="opt"><h4>رنگ: <span>${p.colors[k.color].n}</span></h4>
        <div class="swatches">${p.colors.map((x,i)=>`<button class="swatch" style="background:${x.h}" data-color="${i}" aria-pressed="${i===k.color}" aria-label="${x.n}" title="${x.n}"></button>`).join('')}</div></div>
      <div class="opt"><h4>سایز: <span>${k.size||'ناموجود'}</span></h4>
        <div class="sizes">${Object.entries(p.sizes).map(([s,ok])=>`<button class="size" ${ok?'':'disabled title="ناموجود"'} data-size="${s}" aria-pressed="${s===k.size}">${s}</button>`).join('')}</div></div>
      <div class="buy">
        <div class="qty"><button data-q="-1" aria-label="کم کردن">−</button><span>${fa(k.q)}</span><button data-q="1" aria-label="زیاد کردن">+</button></div>
        <button class="add" data-add="${p.id}" ${k.size?'':'disabled'}>افزودن به سبد خرید</button>
      </div>
      <div class="perks"><div>ارسال ۲ تا ۴ روز کاری</div><div>۷ روز ضمانت تعویض سایز</div></div>
      <div class="section"><h3>توضیحات</h3><p>${p.desc}</p></div>
      <div class="section"><h3>مشخصات</h3><div class="tbl"><table class="specs">${specs.map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</table></div></div>

function route(){
  const m=location.hash.match(/^#p(\d+)$/);
  const p=m&&byId(+m[1]);
  p?product(p):home();
}
function rerenderProduct(){const m=location.hash.match(/^#p(\d+)$/);if(m)product(byId(+m[1]))}

function renderCart(){
  const n=cart.reduce((a,i)=>a+i.q,0);
  $('#count').textContent=fa(n);
  const sub=cart.reduce((a,i)=>a+i.q*byId(i.id).price,0);
  const ship=!cart.length?0:(sub>=FREE?0:SHIP);
  $('#items').innerHTML=cart.length?cart.map((i,k)=>{
    const p=byId(i.id);
    return `<div class="item"><a href="#p${p.id}">${photo(p.img[0],p.name,120,150)}</a>
      <div class="meta"><b>${p.name}</b><span>${p.colors[i.color].n} · سایز ${i.size} · ${toman(p.price)}</span></div>
      <div class="qty"><button data-dec="${k}" aria-label="کم کردن">−</button><span>${fa(i.q)}</span><button data-inc="${k}" aria-label="زیاد کردن">+</button></div></div>`}).join('')
    :'<p class="empty">سبد خرید شما خالی است.<br>روی یک محصول بزنید و آن را به سبد اضافه کنید.</p>';
  $('#sub').textContent=toman(sub);
  $('#ship').textContent=!cart.length?'—':(ship?toman(ship):'رایگان');
  $('#total').textContent=toman(sub+ship);
  $('#shipBar').style.width=Math.min(100,sub/FREE*100)+'%';
  $('#shipNote').textContent=!cart.length?'':(sub>=FREE?'ارسال این سفارش رایگان است.':`${toman(FREE-sub)} دیگر تا ارسال رایگان`);
  $('#checkout').disabled=!cart.length;
}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function openCart(o){$('#drawer').classList.toggle('open',o);$('#drawer').setAttribute('aria-hidden',!o);$('#scrim').hidden=!o}
const curId=()=>{const m=location.hash.match(/^#p(\d+)$/);return m?+m[1]:0};

document.addEventListener('click',e=>{
  const b=e.target.closest('button,a[data-cat]');if(!b)return;
  const d=b.dataset;
  if(d.cat){e.preventDefault();view.cat=d.cat;view.season='all';if(location.hash){location.hash='';}else home();}
  else if(d.season){view.season=d.season;view.cat=view.cat;home();if(b.classList.contains('col'))$('#filters').scrollIntoView({behavior:'smooth'})}
  else if(d.img){pick[curId()].img=+d.img;rerenderProduct()}
  else if(d.color){pick[curId()].color=+d.color;rerenderProduct()}
  else if(d.size){pick[curId()].size=d.size;rerenderProduct()}
  else if(d.q){const k=pick[curId()];k.q=Math.max(1,Math.min(10,k.q+ +d.q));rerenderProduct()}
  else if(d.add){
    const id=+d.add,k=pick[id];
    const ex=cart.find(i=>i.id===id&&i.color===k.color&&i.size===k.size);
    ex?ex.q+=k.q:cart.push({id,color:k.color,size:k.size,q:k.q});
    save();renderCart();toast(`${byId(id).name} به سبد خرید اضافه شد`);
  }
  else if(d.inc){cart[d.inc].q++;save();renderCart()}
  else if(d.dec){const i=cart[d.dec];i.q--;if(!i.q)cart.splice(d.dec,1);save();renderCart()}
  else if(b.id==='openCart')openCart(true);
  else if(b.id==='closeCart')openCart(false);
  else if(b.id==='checkout')toast('این یک نمونه‌کار است و پرداخت واقعی انجام نمی‌شود.');
});
$('#items').addEventListener('click',e=>{if(e.target.closest('a'))openCart(false)});
$('#scrim').addEventListener('click',()=>openCart(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')openCart(false)});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

route();renderCart();
</script>

</body>
</html>
